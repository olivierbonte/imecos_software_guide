on:
  workflow_dispatch:
  push:
    branches: main
  pull_request:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7


      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          version: 1.10.18
          
      - name: Get environment name from hydrologie_env.yml
        id: get-env-name
        run: echo "ENV_NAME=$(yq '.name' hydrologie_env.yml)" >> "$GITHUB_OUTPUT"

      - name: Setup Python with Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: hydrologie_env.yml
          activate-environment: ${{ steps.get-env-name.outputs.ENV_NAME }}
          auto-activate-base: false 
          
      - name: Render and Publish 
        shell: bash -el {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          quarto publish gh-pages --no-browser --no-prompt